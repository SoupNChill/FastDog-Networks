# Host-based routing for Fastdog Edge (Phase 1)
# hostname -> upstream URL
# Do not cut over public Cloudflare traffic. Parallel LAN dogfood only.

routes:
  # Local demo host (add to /etc/hosts -> 192.168.200.42 for LAN testing)
  demo.fastdog.local: http://127.0.0.1:9999

  # NOTE: Do NOT add a static upstream for Summit Lease host ports here.
  # prod1 publishes app :3450 only on docker network summitlease-prod_default
  # (not on the host). Use tunnel agent on prod1 instead (see tunnel_hosts).

# Hosts served via a registered outbound tunnel agent (agent registers hostname).
# Agent on prod1 joins summitlease-prod_default and proxies to http://app:3450.
tunnel_hosts:
  - summitlease.fastdog.lan
  - trysummitlease.com
  # lease.* is public dogfood on FastDog zone; trysummitlease.com public remains on CF
  - lease.fastdognetworks.com