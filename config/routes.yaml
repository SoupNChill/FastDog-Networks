# Host-based routing for Fastdog Edge (Phase 1)
# hostname -> upstream URL
# Do not point production Summit Lease here until dogfood checklist is done.
# Cloudflare tunnel on prod1 stays authoritative for public traffic.

routes:
  # Local demo host (add to /etc/hosts -> 192.168.200.42 for LAN testing)
  demo.fastdog.local: http://127.0.0.1:9999

  # Placeholder for Summit Lease dogfood (parallel to CF — not cut over yet)
  # Once prod1 SSH exists and Docker HTTP port is known, set e.g.:
  # trysummitlease.com: http://192.168.200.7:PORT
  # www.trysummitlease.com: http://192.168.200.7:PORT

# Optional: hosts that should be served via a registered tunnel agent
# (agent registers and advertises these hostnames)
tunnel_hosts: []
