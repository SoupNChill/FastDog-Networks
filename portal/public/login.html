<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Portal</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="/css/site.css"><link rel="stylesheet" href="/css/portal.css"><script type="module" src="/js/login.js"></script></head>
<body><a class="skip" href="#main">Skip to content</a><header class="site-header wrap"><a class="brand" href="/hostname" aria-label="FastDog Networks Portal"><picture><source srcset="/logos/hound-dark.svg" media="(prefers-color-scheme: light)"><img src="/logos/hound-light.svg" width="70" height="21" alt="FastDog Networks"></picture><span>Portal</span></a><nav aria-label="Account navigation"><a href="/login">Sign in</a><a href="/signup">Create account</a></nav></header>
<main id="main" class="wrap split account-layout"><div class="section-marker">Sign in</div><div class="section-body portal-body"><p class="eyebrow">FastDog Networks</p><h1>Welcome back.</h1><p>Sign in to set up your website and manage your account.</p><noscript><p>JavaScript is needed to submit forms and load account details. You can still read these instructions; enable JavaScript and reload to continue.</p></noscript><p id="message" role="status" aria-live="polite"></p><form method="post" id="login"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form><a href="/signup">Create an account</a><details><summary>Forgot password?</summary><form method="post" id="reset-request"><label for="reset-email">Account email</label><input id="reset-email" name="email" type="email" autocomplete="email" required><button type="submit">Send reset link</button></form></details><form method="post" id="reset-confirm" hidden><label for="new-password">New password</label><input id="new-password" name="password" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required><p>Use at least 12 characters and avoid common passwords.</p><button type="submit">Change password</button></form></div></main><footer class="footer wrap"><a class="brand" href="/login">FastDog <span class="brand-second">Networks</span></a><div><span>Customer portal</span><a class="footer-support" href="mailto:{{SUPPORT_EMAIL}}">Stuck? Email {{SUPPORT_EMAIL}}</a></div></footer></body></html>
